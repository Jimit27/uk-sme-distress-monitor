name: daily-score

# Every weekday: fetch the newest accounts Companies House has published,
# rebuild the warehouse, score the filings with the committed model and
# commit the refreshed watchlist the dashboard reads.

on:
  schedule:
    - cron: "17 7 * * 2-6"   # 07:17 UTC, Tue-Sat (files for Mon-Fri appear overnight)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[warehouse]"

      - name: Fetch register extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/extract
          gh release download data-extract --pattern "register_snapshot.parquet" --dir data/extract --clobber

      - name: Latest daily accounts (last 5 files)
        run: |
          scripts/run_step.sh daily python -m smewatch.cli ingest-daily --days 5
          cp data/processed/daily/accounts_*.parquet data/extract/

      - name: Build warehouse
        run: scripts/run_step.sh build python -m smewatch.cli build --select "+fct_live_filings"

      - name: Score
        run: scripts/run_step.sh score python -m smewatch.cli score

      - name: Commit watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/live_scores.parquet
          git diff --cached --quiet || git commit -m "Daily watchlist refresh $(date -u +%F)"
          git push
