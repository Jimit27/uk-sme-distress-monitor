name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[warehouse,dev]"
      - name: Lint
        run: scripts/run_step.sh lint ruff check src tests app
      - name: Tests (parser on real filings, dbt build + data tests, model)
        run: scripts/run_step.sh pytest pytest -q
