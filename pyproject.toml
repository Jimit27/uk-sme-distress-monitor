[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smewatch"
version = "0.1.0"
description = "Early-warning model for UK SME insolvency built on Companies House filings"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jimit Sanghavi" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "lxml>=5.0",
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
warehouse = ["dbt-duckdb>=1.8"]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
smewatch = "smewatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
